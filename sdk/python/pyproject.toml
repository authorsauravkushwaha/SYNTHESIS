[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesis-sdk"
version = "0.1.0"
description = "Dependency-free Python client for the SYNTHESIS evidence-carrying causal world model"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["synthesis_sdk*"]
