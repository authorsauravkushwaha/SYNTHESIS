# SYNTHESIS signed-release pipeline (vision §21–22) — free for public repos.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Produces, with zero paid services:
#   * container image on GHCR (pinned, non-root)
#   * SBOM (SPDX, via syft)
#   * keyless Sigstore signature on the image digest (cosign,
#     identity-bound short-lived cert, recorded in the Rekor
#     transparency log)
#   * BuildKit provenance attestation (SLSA-style, mode=max)
#   * GitHub release carrying the SBOM + verification instructions

name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the GitHub release
  packages: write        # push to GHCR
  id-token: write        # keyless Sigstore signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/synthesis

jobs:
  verify-before-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Full invariant suite must pass before anything is signed
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests/ -q
      - name: Cross-language chain verification
        run: |
          gcc -O2 -Wall -Werror -o tools/ledgercheck/ledgercheck tools/ledgercheck/ledgercheck.c
          python - <<'EOF' > /tmp/chain.tsv
          from server.world import WORLD
          print(WORLD.chain.export_tsv(), end="")
          EOF
          ./tools/ledgercheck/ledgercheck < /tmp/chain.tsv

  build-sign-publish:
    needs: verify-before-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (with BuildKit provenance attestation)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: mode=max
          sbom: true

      - name: Generate standalone SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: synthesis-${{ github.ref_name }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign the image digest (Sigstore / Rekor)
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub release with SBOM + verification instructions
        uses: softprops/action-gh-release@v2
        with:
          files: synthesis-${{ github.ref_name }}.spdx.json
          body: |
            ## SYNTHESIS ${{ github.ref_name }}

            Image: `${{ env.IMAGE }}:${{ github.ref_name }}`
            Digest: `${{ steps.build.outputs.digest }}`

            ### Verify before you trust (the SYNTHESIS way)

            ```bash
            # 1. signature (keyless, recorded in the Rekor transparency log)
            cosign verify \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

            # 2. SBOM: attached as synthesis-${{ github.ref_name }}.spdx.json

            # 3. run it, then verify the evidence chain with the C tool
            docker run -p 8000:8000 ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            curl -s localhost:8000/api/ledger/export | ./tools/ledgercheck/ledgercheck
            ```

            No paid services were involved in producing or signing this release.
