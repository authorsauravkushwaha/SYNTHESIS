name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Import & schema smoke test
        run: python -m compileall server && python -c "from server.world import WORLD; s=WORLD.global_state(); assert s['chain_length']>10"
      - name: Build C ledger verifier
        run: gcc -O2 -Wall -Werror -o tools/ledgercheck/ledgercheck tools/ledgercheck/ledgercheck.c
      - name: Verify tamper-evident chain (C tool vs Python chain)
        run: |
          python - <<'EOF' > /tmp/chain.tsv
          from server.world import WORLD
          print(WORLD.chain.export_tsv(), end="")
          EOF
          ./tools/ledgercheck/ledgercheck < /tmp/chain.tsv
