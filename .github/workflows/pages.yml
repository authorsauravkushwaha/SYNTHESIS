# Publishes the SYNTHESIS console to GitHub Pages on every push to main.
# The build boots two real peered nodes, lets the world evolve, freezes the
# state into JSON and ships the PWA — so the public site is a genuine
# engine-produced snapshot, installable on PC and mobile, at $0.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Build static snapshot (two peered nodes, full-fidelity wait)
        run: python scripts/build_pages.py

      # NOTE: Pages must be enabled once in the repo UI:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # (auto-enablement via the API is not permitted for the default token)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
